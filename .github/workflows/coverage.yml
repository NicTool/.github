name: Coverage

on:
  workflow_call:
    inputs:
      dnssec-tools:
        description: install BIND's dnssec-keygen and dnssec-signzone
        type: boolean
        required: false
        default: false
      mysql:
        description: start MySQL and load the schema
        type: boolean
        required: false
        default: false
      data-stores:
        description: run coverage once per NICTOOL_DATA_STORE, comma separated
        type: string
        required: false
        default: ''

env:
  CI: true
  NODE_ENV: cov

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: install BIND dnssec tools
        if: inputs.dnssec-tools
        run: sudo apt-get update && sudo apt-get install -y bind9-utils
      - name: start MySQL
        if: inputs.mysql
        run: sudo /etc/init.d/mysql start
      - name: initialize MySQL
        if: inputs.mysql
        run: sh sql/init-mysql.sh
      - run: npm install
      - name: measure coverage
        id: cov
        env:
          STORES: ${{ inputs.data-stores }}
        run: |
          if [ -z "$STORES" ]; then
            npm run test:coverage:lcov || npm run test:coverage
            exit 0
          fi
          for store in $(echo "$STORES" | tr ',' ' '); do
            NICTOOL_DATA_STORE=$store npm run test:coverage:lcov
            cp coverage/lcov.info "coverage/lcov-$store.info"
          done
          # coveralls below reads coverage/lcov.info, so leave the first store there
          cp "coverage/lcov-$(echo "$STORES" | cut -d, -f1).info" coverage/lcov.info
          echo "files=$(ls coverage/lcov-*.info | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - uses: codecov/codecov-action@v6
        with:
          files: ${{ steps.cov.outputs.files }}
          disable_search: ${{ steps.cov.outputs.files != '' }}
      - uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
