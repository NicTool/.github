name: Test Coverage

on:
  workflow_call:
    inputs:
      dnssec-tools:
        description: install BIND's dnssec-keygen and dnssec-signzone
        type: boolean
        required: false
        default: false

env:
  CI: true
  NODE_ENV: cov

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: install BIND dnssec tools
        if: inputs.dnssec-tools
        run: sudo apt-get update && sudo apt-get install -y bind9-utils
      - run: npm install
      - run: npm run test:coverage:lcov || npm run test:coverage
      - uses: codecov/codecov-action@v6
      - uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
