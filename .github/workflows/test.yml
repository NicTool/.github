name: Test

on:
  workflow_call:
    inputs:
      dnssec-tools:
        description: install BIND's dnssec-keygen and dnssec-signzone (Linux and macOS runners)
        type: boolean
        required: false
        default: false

jobs:
  test:
    needs: get-lts
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ${{ fromJson(needs.get-lts.outputs.lts) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: install BIND dnssec tools
        if: inputs.dnssec-tools
        run: sudo apt-get update && sudo apt-get install -y bind9-utils
      - run: npm install
      - run: npm test

  test-active:
    # only test on the active LTS version, to save resources
    needs: get-lts
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        node-version: ${{ fromJson(needs.get-lts.outputs.active) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      # brew lays dnssec-keygen down in bin and named in sbin; add both rather
      # than guess which one this BIND release used.
      - name: install BIND dnssec tools
        if: inputs.dnssec-tools && runner.os == 'macOS'
        run: |
          brew install bind
          echo "$(brew --prefix bind)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bind)/sbin" >> "$GITHUB_PATH"
      - run: npm install
      - run: npm test

  get-lts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: get
        uses: msimerson/node-lts-versions@v1
    outputs:
      lts: ${{ steps.get.outputs.lts }}
      active: ${{ steps.get.outputs.active }}
